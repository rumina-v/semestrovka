<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Концовка - Detective Interrogation</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="ending">
    <header class="ending-top">
        <a class="back-link" href="/" aria-label="На главную">←</a>
        <a class="nav-button solid ending-profile-link" href="/profile">Профиль</a>
    </header>

    <main class="ending-stage" data-ending-page>
        <section class="ending-report">
            <p>Итог</p>
            <h1 data-ending-title>Судебное решение</h1>
            <div data-ending-text>
                Расследование завершено. Суд изучил материалы дела, признания и противоречия в показаниях.
            </div>
        </section>
        <aside class="ending-images">
            <figure>
                <div class="ending-image court" data-court-image></div>
                <figcaption>Из зала суда</figcaption>
            </figure>
            <figure>
                <div class="ending-image prison" data-prison-image></div>
                <figcaption>Из тюрьмы</figcaption>
            </figure>
        </aside>
    </main>

    <script src="/js/core.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/caseDesk.js"></script>
    <script src="/js/interrogation.js"></script>
    <script src="/js/pages.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
