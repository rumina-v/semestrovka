<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация - Detective Interrogation</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="auth">
    <a class="back-link" href="javascript:history.back()" aria-label="Назад">←</a>

    <main class="auth-screen">
        <form class="auth-card" data-register-form>
            <h1>Регистрация</h1>
            <label>
                Имя
                <input name="username" autocomplete="username" required minlength="3">
            </label>
            <label>
                Email
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
                Пароль
                <input name="password" type="password" autocomplete="new-password" required minlength="6">
            </label>
            <button class="primary-action" type="submit">Зарегистрироваться</button>
            <div class="status" data-status></div>
        </form>
    </main>

    <script src="/js/core.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/caseDesk.js"></script>
    <script src="/js/interrogation.js"></script>
    <script src="/js/pages.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
